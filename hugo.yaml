params:
  customCSS: ["/css/custom.css"]
  version: "dev"
  author:
    name: "0xAyb3rK"
  themeColor: "#0d1117"
  # Default social-preview (Open Graph) image used when a page has no `images`.
  images:
    - "images/ada-bg.jpg"
  # Privacy-friendly analytics. Set to your GoatCounter code (e.g. "0xayb3rk")
  # after signing up at https://www.goatcounter.com — leave empty to disable.
  goatcounter: "ayb3rk"
  # GitHub-based comments (giscus). Comments stay OFF until categoryId is set
  # (pick a Discussion category on https://giscus.app to get it).
  giscus:
    repo: "0xAyb3rK/ayberkcataloluk.dev"
    repoId: "R_kgDOSRc4tA"
    category: "Announcements"
    categoryId: "DIC_kwDOSRc4tM4DHFDb"
  defaultTheme: "dark"
  EnableThemeToggle: true
  EnableSharingButtons: true
  EnableGlobalLanguageMenu: true
  backgroundEffects: true
  showPosts: true
  showSummary: true
  tags: true
  paginate: 5
  ReadMoreText: true
  fontAwesome: 
    all: true
  ShowReadingTime: true
  LastModDisplay: true
  logo:
    logoText: "0xAyb3rK"
    logoCursorColor: "#ffffff"
  social:
    - name: "github"
      url: "https://github.com/0xAyb3rK" 
    - name: "linkedin"
      url: "https://www.linkedin.com/in/ayberk-%C3%A7ataloluk-9b05a5257/"   
  
  footer:
    showVersion: true
    socialIcons: true
    author: true
    rss: true
    trademark: true
    copyright: true
    bottomText: [
      "Powered by <a href=\"http://gohugo.io\">Hugo</a>", 
      "with <a href=\"https://github.com/4s3ti/hugo-theme-hello-4s3ti\">Hello-friend-4s3ti</a>",
    ]

