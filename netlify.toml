# Netlify build & security configuration
# Deploy: continuous deployment from the GitHub `main` branch.

[build]
  publish = "public"
  # Build the site, then generate the static Pagefind search index.
  command = "hugo --gc --minify && npx -y pagefind --site public"

[build.environment]
  HUGO_VERSION = "0.164.0"
  HUGO_ENV = "production"
  TZ = "Europe/Istanbul"

# ---------------------------------------------------------------------------
# Security headers (applied to every response).
# Verify the result at https://securityheaders.com after deploy.
# If something fails to load, loosen the Content-Security-Policy below.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://giscus.app https://gc.zgo.at; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' https: data:; connect-src 'self' https://*.goatcounter.com; frame-src https://giscus.app; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Long-cache fingerprinted assets
[[headers]]
  for = "/pagefind/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
