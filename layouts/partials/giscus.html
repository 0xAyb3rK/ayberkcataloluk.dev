{{/* GitHub Discussions comments via giscus. Renders only when configured. */}}
{{ with .Site.Params.giscus }}
{{ if and .repo .categoryId }}
<section class="giscus-wrapper">
  <script src="https://giscus.app/client.js"
    data-repo="{{ .repo }}"
    data-repo-id="{{ .repoId }}"
    data-category="{{ .category }}"
    data-category-id="{{ .categoryId }}"
    data-mapping="pathname"
    data-strict="0"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="top"
    data-theme="dark"
    data-lang="{{ $.Site.Language.Lang }}"
    crossorigin="anonymous"
    async>
  </script>
</section>
<script>
  /* Keep giscus in sync with the site's light/dark choice. */
  (function () {
    function giscusTheme() {
      return document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
    }
    function apply() {
      var f = document.querySelector("iframe.giscus-frame");
      if (f) f.contentWindow.postMessage({ giscus: { setConfig: { theme: giscusTheme() } } }, "https://giscus.app");
    }
    window.addEventListener("message", function (e) {
      if (e.origin === "https://giscus.app") apply();
    });
  })();
</script>
{{ end }}
{{ end }}
